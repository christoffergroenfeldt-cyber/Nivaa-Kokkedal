name: Udgiv Supabase-funktionen
# Udgiver Edge Function "api" (supabase/functions/api/) til NKB-projektet, når serverkoden ændres på main.
# Kan også startes i hånden: Actions → Udgiv Supabase-funktionen → Run workflow.
# Kræver secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
# Migrationer (nye tabeller) køres stadig i hånden i SQL Editor — se docs/SUPABASE.md.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
env:
  PROJECT_REF: rbsuittqekgaudmstpqu
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Udgiv api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN mangler (Settings → Secrets and variables → Actions)"; exit 1; fi
          supabase functions deploy api --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: Tjek versionen
        run: |
          want=$(grep -oP "SCRIPT_VERSION = '\K[^']+" supabase/functions/api/index.ts)
          for i in 1 2 3 4 5 6; do
            got=$(curl -sSL -m 20 "https://$PROJECT_REF.supabase.co/functions/v1/api?action=version" | grep -oP '"version":"\K[^"]+' || true)
            [ "$got" = "$want" ] && { echo "::notice title=Udgivet::Serveren kører $got"; exit 0; }
            sleep 10
          done
          echo "::error title=Version::Forventede $want, serveren svarer '${got:-intet}'"; exit 1
