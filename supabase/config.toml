# Kun det funktionen kræver, når den udgives med Supabase CLI:  supabase functions deploy api
# Appen kalder funktionen uden Supabase-login (den har sit eget login med e-mail-kode), så JWT-tjek skal være slået fra.
[functions.api]
entrypoint = "./functions/api/main.ts"
verify_jwt = false

# HØBK kører på samme kode (supabase/functions/api/) med egne tabeller i schema "hoebk" — se supabase/functions/hoebk/
[functions.hoebk]
entrypoint = "./functions/hoebk/main.ts"
verify_jwt = false
